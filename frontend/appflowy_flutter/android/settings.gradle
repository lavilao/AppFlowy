pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    // Flutter 3.50 builds its Gradle plugin from the SDK instead of applying
    // the old script: "app_plugin_loader.gradle" may no longer be applied with
    // `apply from:`, it has to be included as a plugin (and the plugin loader
    // then pulls in every Flutter plugin declared in .flutter-plugins-dependencies).
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Plugin versions live here now that the buildscripts are gone; these are
    // the minimums Flutter 3.50's Gradle plugin enforces.
    id "com.android.application" version "9.1.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

// Flutter plugins still declare an old compileSdk (connectivity_plus compiles
// against android-33) while the androidx libraries they pull in already require
// 34+, and AGP checks that per module (checkReleaseAarMetadata). Every Android
// module is raised to the app's compileSdk.
//
// This has to be registered here, not in build.gradle: `beforeProject` runs
// before the project script, so the afterEvaluate hook is added before AGP adds
// its own, and the value is in place by the time the variant is created. From
// build.gradle it is both too late in the evaluation order and, for modules
// pulled in with evaluationDependsOn, an outright error ("project is already
// evaluated").
gradle.beforeProject { project ->
    project.afterEvaluate {
        def androidExtension = project.extensions.findByName('android')
        if (androidExtension != null &&
            androidExtension.hasProperty('compileSdkVersion')) {
            androidExtension.compileSdkVersion = 36
        }
    }
}

include ":app"