plugins {
    id "com.android.application"
    // Declared with the same id in settings.gradle (KGP publishes the legacy
    // "kotlin-android" alias, but keeping one id avoids resolution surprises).
    id "org.jetbrains.kotlin.android"
    // Compiles and embeds the Dart code (the plugin used to be applied with
    // `apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"`,
    // which Flutter 3.50 no longer allows).
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
    // MUST be the same NDK that builds libdart_ffi.so (the Rust backend, built
    // by cargo-ndk with the NDK pinned in the CI workflow). libdart_ffi.so
    // links libc++_shared.so dynamically against that NDK's C++ runtime, and
    // src/main/CMakeLists.txt copies libc++_shared.so into the APK from THIS
    // ndkVersion — it also overwrites the copy that cargo-ndk drops into
    // jniLibs. If the two drift apart (an older runtime packaged next to a
    // newer-linked libdart_ffi.so), dlopen fails on launch with:
    //   dlopen failed: cannot locate symbol
    //   "_ZTTNSt6__ndk118basic_stringstreamIcNS_11char_traitsIcEENS_9allocatorIcEEEE"
    // (17 missing __ndk1 symbols: stringstream/stringbuf/filebuf vtables &
    // VTTs) → "Failed to load dynamic library 'libdart_ffi.so'" before the
    // first Flutter frame, i.e. the black-screen crash on 32-bit devices.
    // r27d == 27.3.13750724 (https://github.com/android/ndk/releases/tag/r27d).
    // NDK r28c == 28.2.13676358, the default of Flutter 3.50 (gradle_utils.dart).
    // It MUST stay in lockstep with the NDK that cargo-ndk links
    // libdart_ffi.so against (CI NDK_VERSION) and with the libc++_shared.so
    // that src/main/CMakeLists.txt copies into the APK: Flutter's own plugin
    // modules build with flutter.ndkVersion, so a different value here would
    // put two NDKs' native output in one APK.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += 'jniLibs/'
    }

    // libdart_ffi.so, the CMake external build and the Flutter engine can all
    // bring their own libc++_shared.so. Never fail the merge on duplicates;
    // the post-build sanity check
    // (frontend/scripts/check_apk_libcxx_symbols.sh) verifies that the copy
    // that survives is the NDK r27d runtime that libdart_ffi.so was linked
    // against.
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.appflowy.appflowy"
        minSdk 29
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STL=c++_shared"
            }
        }
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }
    buildTypes {
        release {
            // Sign with the stable committed keystore (android/key.properties
            // + android/app/appflowy-upload.jks) so every CI release carries
            // the SAME signature and updates install over previous releases
            // without losing user data. Fall back to the ephemeral debug
            // keystore when key.properties is absent (fresh local checkouts).
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    namespace 'io.appflowy.appflowy'

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
        }
    }

    defaultConfig {
        ndk {
            // This fork ships a single, 32-bit APK. AGP 9 no longer leaves the
            // --split-per-abi output where Flutter's tool looks for it, so the
            // build is a plain arm build (--target-platform android-arm) and
            // the ABI is pinned here: otherwise the libc++ copies that
            // src/main/CMakeLists.txt drops into jniLibs for the other ABIs
            // would be packaged as well.
            abiFilters "armeabi-v7a"
        }
    }
}

flutter {
    source '../..'
}

// Kotlin 2.x sets jvmTarget from compileOptions; the Kotlin Gradle plugin adds
// the stdlib automatically, and minSdk 29 has native multidex (the legacy
// com.android.support:multidex artifact and kotlin-stdlib-jdk7 no longer have
// a job here).

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
