# AGP 9 + Kotlin 2.4 need more heap than the old 1536M while configuring the
# app and its many plugin modules.
org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
# Jetifier only rewrites legacy com.android.support artifacts; AGP 9 no longer
# needs it and the last legacy dependency (support-multidex) is gone.
android.enableJetifier=false
org.gradle.caching=true