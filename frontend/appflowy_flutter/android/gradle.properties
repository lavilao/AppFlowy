# AGP 9 + Kotlin 2.4 need more heap than the old 1536M while configuring the
# app and its many plugin modules. (Flutter's template asks for 8G; CI runners
# have less, and 4G leaves room for the Kotlin daemon.)
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
# Jetifier only rewrites legacy com.android.support artifacts; AGP 9 no longer
# needs it and the last legacy dependency (support-multidex) is gone.
android.enableJetifier=false
org.gradle.caching=true

# Flutter 3.50's AGP 9 compatibility: the Flutter Gradle plugin and the Kotlin
# Android plugin still rely on the legacy DSL and on KGP providing Kotlin
# compilation, so both new AGP 9 defaults are opted out of (this is exactly
# what `flutter create` writes into android/gradle.properties).
android.newDsl=false
android.builtInKotlin=false