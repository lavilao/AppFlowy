// Plugin and dependency versions (AGP 9.1.1, Kotlin 2.4.21, the Flutter
// Gradle plugin) are declared in settings.gradle's pluginManagement/plugins
// blocks: Flutter 3.50 no longer supports applying its Gradle plugin with
// `apply from:`, so the buildscript classpath this file used to carry is gone.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed Project.buildDir; layout.buildDirectory is the replacement.
// Keep the historical layout: <flutter project>/build/<module>.
def appflowyBuildDir = rootProject.layout.buildDirectory.dir('../build').get()
rootProject.layout.buildDirectory.set(appflowyBuildDir)
subprojects {
    project.layout.buildDirectory.set(appflowyBuildDir.dir(project.name))
    project.evaluationDependsOn(':app')
}

// Flutter plugins still declare an old compileSdk (connectivity_plus compiles
// against android-33) while the androidx libraries they pull in already require
// 34+, and AGP checks that per module (checkReleaseAarMetadata). Raise every
// Android module to the app's compileSdk instead of patching each plugin; the
// check reads the value after evaluation, so it has to be set here.
subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExtension = subproject.extensions.findByName('android')
        if (androidExtension != null &&
            androidExtension.hasProperty('compileSdkVersion')) {
            androidExtension.compileSdkVersion = 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}