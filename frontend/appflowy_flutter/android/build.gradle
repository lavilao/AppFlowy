buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Flutter 3.50's Gradle plugin requires AGP >= 9.1.1, Gradle >= 9.3.1
        // and Kotlin >= 2.4.10 (see DependencyVersionChecker.kt in
        // packages/flutter_tools/gradle).
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 removed Project.buildDir; layout.buildDirectory is the replacement.
// Keep the historical layout: <flutter project>/build/<module>.
def appflowyBuildDir = rootProject.layout.buildDirectory.dir('../build').get()
rootProject.layout.buildDirectory.set(appflowyBuildDir)
subprojects {
    project.layout.buildDirectory.set(appflowyBuildDir.dir(project.name))
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}