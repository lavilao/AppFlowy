group 'com.example.flowy_infra_ui'
version '1.0'

// No local buildscript: AGP comes from android/settings.gradle, so this module
// is built with the same AGP as the app (it used to pin AGP 7.4.2 locally).
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    namespace 'com.example.flowy_infra_ui'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dependencies {
        implementation "androidx.core:core:1.5.0-rc01"
    }
}