group 'com.plugin.appflowy_backend'
version '1.0-SNAPSHOT'

// No local buildscript: AGP and the Kotlin Gradle plugin are declared once in
// android/settings.gradle, and Gradle 9 removed jcenter() (the repositories
// block it used to need is now shared by the root project).
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    namespace 'com.plugin.appflowy_backend'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 23
    }
}

// Kotlin 2.x adds the stdlib automatically; kotlin-stdlib-jdk7 is no longer
// published as a separate artifact.