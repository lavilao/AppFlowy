name: Build Android APK (ARMeabiv7)

on:
  push:
    branches:
      - "main"
      - "release/*"
    paths:
      - ".github/workflows/build-armeabiv7-glm.yml"
      - "frontend/**"

  pull_request:
    branches:
      - "main"
      - "release/*"
    paths:
      - ".github/workflows/build-armeabiv7-glm.yml"
      - "frontend/**"
      - "!frontend/appflowy_tauri/**"

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.11.4, leave empty for auto-tag from pubspec version)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''
      is_draft:
        description: 'Draft release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed by softprops/action-gh-release to publish releases

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.50.1"
  RUST_TOOLCHAIN: "1.85.0"
  CARGO_MAKE_VERSION: "0.37.18"
  CARGO_NDK_VERSION: "3.5.4"
  # r28c. MUST stay in lockstep with ndkVersion in
  # frontend/appflowy_flutter/android/app/build.gradle: libdart_ffi.so is
  # linked against THIS NDK's libc++_shared.so, and gradle's externalNativeBuild
  # (src/main/CMakeLists.txt) packages THIS NDK's libc++_shared.so. A mismatch
  # (e.g. r24 runtime + r28c-linked Rust lib) fails at dlopen on launch:
  #   cannot locate symbol "_ZTTNSt6__ndk118basic_stringstream..."
  # r28c == 28.2.13676358 (https://github.com/android/ndk/releases/tag/r28c).
  NDK_VERSION: "28.2.13676358"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_apk_armeabiv7:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Release Rust build (O2) takes longer than the previous debug build on a
    # cold cache; 150 min leaves headroom for both codegen and the APK build.
    timeout-minutes: 150

    steps:
      - name: Check storage space
        run: df -h

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo rm -rf /opt/hostedtoolcache/codeQL

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # actions-rs/toolchain is archived/unmaintained; dtolnay/rust-toolchain
      # is the standard replacement and also lets us install the Android
      # targets in the same step instead of three separate `rustup target
      # install` calls later on.
      - name: Install Rust toolchain
        id: rust_toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # gradle/gradle-build-action was archived Feb 2025; gradle/actions/setup-gradle
      # is its official, functionally-identical successor.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # ──────────────────────────────────────────────────────────────────────
      # PIN the NDK to r28c so that EVERY piece of native code in the APK uses
      # the same libc++ runtime:
      #   * cargo-ndk links libdart_ffi.so against r28c's libc++_shared.so
      #     (119 undefined __ndk1 symbols, resolved at dlopen time);
      #   * gradle (ndkVersion 28.2.13676358 in app/build.gradle) builds the
      #     CMake stub and copies r28c's libc++_shared.so into the APK.
      # Without this pin, cargo-ndk picks whatever NDK the runner image has
      # (drifts over time) and the APK can end up with a libc++ runtime older
      # than the one libdart_ffi.so was linked against → dlopen fails on
      # launch with "cannot locate symbol _ZTTNSt6__ndk118basic_stringstream..."
      # (the Redmi 9A black-screen crash). ANDROID_NDK_HOME/NDK_HOME pin
      # cargo-ndk; ndkVersion pins gradle — both now point at the exact same
      # r28c build.
      # ──────────────────────────────────────────────────────────────────────
      - name: Install pinned Android NDK r28c (28.2.13676358)
        run: |
          set -euo pipefail
          NDK_VERSION="${{ env.NDK_VERSION }}"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          mkdir -p "$ANDROID_HOME/ndk"

          install_via_sdkmanager() {
            local SDKM=""
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif command -v sdkmanager > /dev/null 2>&1; then
              SDKM="$(command -v sdkmanager)"
            else
              echo "sdkmanager not on PATH and no cmdline-tools installed"
              return 1
            fi
            echo "Using sdkmanager: $SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" "ndk;$NDK_VERSION" > /dev/null || return 1
          }

          install_via_direct_download() {
            echo "Installing NDK $NDK_VERSION from the official zip (dl.google.com)..."
            curl -sSL --retry 3 -o /tmp/android-ndk-linux.zip \
              "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
            rm -rf /tmp/ndk-extract "$NDK_DIR"
            unzip -q /tmp/android-ndk-linux.zip -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r28c "$NDK_DIR"
            rm -rf /tmp/ndk-extract /tmp/android-ndk-linux.zip
          }

          if ! install_via_sdkmanager; then
            echo "sdkmanager unavailable/failed — falling back to direct download"
            install_via_direct_download
          fi

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: NDK $NDK_VERSION install failed — $NDK_DIR/source.properties missing"
            ls "$ANDROID_HOME/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK $NDK_VERSION installed at: $NDK_DIR"
          grep -E "Pkg\.Revision|Pkg\.Desc" "$NDK_DIR/source.properties"
        shell: bash

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1
        with:
          version: ${{ env.CARGO_MAKE_VERSION }}

      - name: Install Android NDK and build tools
        working-directory: frontend
        run: |
          set -euo pipefail
          # Re-added explicitly, scoped to this directory. dtolnay/rust-toolchain's
          # `targets:` input (see the earlier step) attaches the Android targets to
          # whatever toolchain it installs at the repo root — but if anything under
          # frontend/ (e.g. a rust-toolchain.toml) makes rustup resolve a *different*
          # toolchain once cargo actually runs from here, that toolchain gets
          # auto-installed on the fly with NO extra targets, and the build fails with
          # "can't find crate for `core`" for aarch64-linux-android. Running this here
          # guarantees the targets are attached to whatever toolchain actually gets
          # used for the build, matching how the original (working) workflow did it.
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          cargo install --force --locked duckscript_cli
          # cargo-ndk 4.x requires Rust >= 1.86 and introduced breaking
          # changes, so we pin to the compatible 3.x line. (Only installed
          # once now — the previous duplicate install with/without --locked
          # was wasted build time.)
          cargo install --force --version "${{ env.CARGO_NDK_VERSION }}" --locked cargo-ndk
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            build-essential \
            libssl-dev \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            keybinder-3.0 \
            libnotify-dev \
            gcc-multilib
          cargo make appflowy-flutter-deps-tools
          echo "Rust:"
          rustc --version
          echo "Cargo:"
          cargo --version
          echo "cargo-ndk:"
          cargo ndk --version
        shell: bash

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/rust-lib
          cache-all-crates: true

      # ──────────────────────────────────────────────────────────────────────
      # PATCH: disable AppFlowy's hardcoded arm64-v8a abiFilters.
      #
      # AppFlowy's android/app/build.gradle contains:
      #
      #     // only support arm64-v8a
      #     defaultConfig {
      #         ndk {
      #             abiFilters "arm64-v8a"
      #         }
      #     }
      #
      # When --split-per-abi is passed to `flutter build apk`, Flutter's
      # gradle plugin activates `splits { abi { ... } }`. Gradle FORBIDS
      # having both `ndk.abiFilters` AND `splits.abi` filters set, and
      # fails with:
      #
      #     Conflicting configuration : 'arm64-v8a' in ndk abiFilters
      #     cannot be present when splits abi filters are set : armeabi-v7a
      #
      # We comment out the abiFilters line in-place so --split-per-abi is
      # free to drive ABI selection. The patch is idempotent — re-running
      # it on an already-patched file is a no-op.
      # ──────────────────────────────────────────────────────────────────────
      - name: Patch build.gradle (remove hardcoded arm64-v8a abiFilters)
        working-directory: frontend/appflowy_flutter/android/app
        run: |
          set -euo pipefail
          echo "==== build.gradle: abiFilters lines BEFORE patch ===="
          grep -n "abiFilters" build.gradle || echo "(none found)"

          # Idempotent: only replace lines that still have the uncommented form.
          sed -i \
            's|^\(\s*\)abiFilters "arm64-v8a"|\1// abiFilters "arm64-v8a"  # disabled by CI for --split-per-abi build|' \
            build.gradle

          echo "==== build.gradle: abiFilters lines AFTER patch ===="
          grep -n "abiFilters" build.gradle || echo "(none remaining)"

          if grep -qE '^\s*abiFilters\s+"arm64-v8a"' build.gradle; then
            echo "ERROR: patch did not apply — uncommented abiFilters line still present."
            exit 1
          fi
        shell: bash

      - name: Build Rust core for ARMeabiv7
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "Building Rust backend for armeabi-v7a (RELEASE)..."
          # ──────────────────────────────────────────────────────────────────
          # CRITICAL: use `appflowy-core-dev-android-ci`, NOT
          # `appflowy-core-dev-android`.
          #
          # The default `appflowy-core-dev-android` task runs:
          #     cargo ndk -t arm64-v8a -o ./jniLibs build ...
          # i.e. it ONLY produces libdart_ffi.so for arm64-v8a. If we used
          # it here, the subsequent `flutter build apk --target-platform
          # android-arm --split-per-abi` would happily produce an
          # armeabi-v7a APK with NO native library inside, and the APK
          # would install on the Redmi 9A but crash on launch with
          # `UnsatisfiedLinkError`.
          #
          # FIX for the black/transparent screen on Redmi 9A (and any
          # low-end 32-bit device):
          #
          # The stock `sdk-build-android-ci` task is hardcoded to a DEBUG
          # Rust build. A debug libdart_ffi.so is unstripped (hundreds of
          # MB, millions of relocations) and AppFlowy's Rust backend init
          # (storage + migrations + tokio runtime) runs at -O0. On a
          # Helio G25 / 2 GB RAM device the InitRustSDKTask hangs or gets
          # OOM-killed. Because AppFlowy only calls runApp() AFTER the
          # Rust SDK init task completes (see lib/startup/startup.dart:
          # InitAppWidgetTask runs after InitRustSDKTask), the Flutter UI
          # never paints a single frame → permanent black/transparent
          # screen.
          #
          # We therefore build the Rust core in RELEASE for armeabi-v7a:
          #   1. `--profile production-android` sets BUILD_FLAG=release.
          #   2. The (patched in this fork) `sdk-build-android-ci` task
          #      honors BUILD_FLAG and adds `--release` + `-t armeabi-v7a`.
          #   3. production-android does NOT define FLUTTER_DESKTOP_FEATURES,
          #      so we pass it explicitly with --env (same value as the
          #      development-android profile uses: "dart,openssl_vendored").
          # Only armeabi-v7a is needed: the APK is built with
          # `--target-platform android-arm --split-per-abi`, so an arm64
          # libdart_ffi.so would be dead weight in the v7a split APK and
          # doubles the build time for nothing.
          # ──────────────────────────────────────────────────────────────────
          export FLUTTER_DESKTOP_FEATURES="dart,openssl_vendored"
          cargo make \
            --profile production-android \
            --env FLUTTER_DESKTOP_FEATURES="dart,openssl_vendored" \
            appflowy-core-dev-android-ci
          # Codegen output is build-profile independent; keep the dev
          # profile here so this step stays byte-identical to upstream.
          cargo make --profile development-android code_generation

          # Sanity check: confirm the armeabi-v7a .so exists in jniLibs
          # before `cargo clean` wipes the build artifacts. The .so file
          # has already been copied to android/app/src/main/jniLibs/ by
          # post-mobile-android, so cleaning target/ is safe — but verify
          # first so we fail loudly here instead of producing a broken APK.
          echo "==== libdart_ffi.so files in jniLibs ===="
          find rust-lib/jniLibs -name "libdart_ffi.so" -exec ls -lh {} \;
          for abi in armeabi-v7a; do
            if [ ! -f "rust-lib/jniLibs/${abi}/libdart_ffi.so" ]; then
              echo "ERROR: libdart_ffi.so for ${abi} is missing from jniLibs."
              echo "The Rust build did not produce the expected native libraries."
              exit 1
            fi
            if [ ! -f "appflowy_flutter/android/app/src/main/jniLibs/${abi}/libdart_ffi.so" ]; then
              echo "ERROR: libdart_ffi.so for ${abi} was not copied into the android project."
              exit 1
            fi
          done

          cd rust-lib
          cargo clean
        shell: bash

      - name: Build Flutter dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "Getting Flutter dependencies..."
          cargo make pub_get
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # The pinned appflowy_editor revision predates Flutter 3.50's
      # TextInputClient.onFocusReceived, so its DeltaTextInputService does not
      # compile as-is. Upstream fixed it in a July 2026 commit; until the app
      # moves to a newer editor, the one missing method is spliced into the
      # checkout. Idempotent, and it fails the build if the pinned revision
      # no longer looks the way the patch expects.
      # ──────────────────────────────────────────────────────────────────────
      - name: Patch pinned dependencies for Flutter 3.50
        working-directory: frontend
        run: |
          set -euo pipefail
          bash ./scripts/patch_appflowy_editor.sh
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # Cactus on-device intelligence.
      #
      # The static engine (5 MB, both Android ABIs) is linked into
      # libflowy_cactus.so by src/main/CMakeLists.txt, and the three .cact
      # models (74 MB) are packaged as Flutter assets. Neither is committed,
      # so both are fetched here from the Apache-2.0 Cactus release on Hugging
      # Face, pinned by revision and verified against a SHA-256. A failure
      # here fails the build: shipping without the models would silently
      # remove the features they power.
      # ──────────────────────────────────────────────────────────────────────
      - name: Fetch the Cactus engine and models
        working-directory: frontend
        run: |
          set -euo pipefail
          bash ./scripts/fetch_cactus.sh all
          echo "==== models to be packaged ===="
          ls -l appflowy_flutter/assets/cactus
          echo "==== engine to be linked ===="
          ls -l appflowy_flutter/android/app/src/main/cactus/*/libcactus.a
        shell: bash

      - name: Build APK for ARMeabiv7
        working-directory: frontend/appflowy_flutter
        run: |
          set -euo pipefail
          echo "Building APK for ARMeabiv7 architecture..."
          # A single arm APK: --split-per-abi relies on AGP's abi splits, whose
          # output AGP 9 no longer leaves where Flutter's tool looks for it
          # ("Gradle build failed to produce an .apk file" although Gradle
          # succeeded). --target-platform android-arm already limits the APK to
          # armeabi-v7a, which is the only ABI this fork ships.
          flutter build apk \
            --target-platform android-arm \
            --release
          echo "==== produced APKs ===="
          find build -name '*.apk' -exec ls -lh {} \;
          echo "==== native ABIs in the arm APK ===="
          unzip -l build/app/outputs/flutter-apk/*.apk | grep 'lib/' | head -10
        shell: bash

      # ──────────────────────────────────────────────────────────────────────
      # Post-build sanity check that would have caught the Redmi 9A crash:
      # the libc++_shared.so INSIDE the APK must export every libc++ (__ndk1)
      # symbol that libdart_ffi.so needs, otherwise dlopen fails before the
      # first Flutter frame ("Failed to load dynamic library 'libdart_ffi.so'").
      # Fails the build BEFORE the APK is published.
      # ──────────────────────────────────────────────────────────────────────
      - name: Sanity check libc++_shared.so vs libdart_ffi.so (__ndk1 symbols)
        working-directory: frontend/appflowy_flutter/build/app/outputs/flutter-apk
        run: |
          set -euo pipefail
          export READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          APK="$(ls app-release.apk app-armeabi-v7a-release.apk 2>/dev/null | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: no APK to check in $(pwd)"
            ls -la
            exit 1
          fi
          echo "Checking $APK"
          bash "$GITHUB_WORKSPACE/frontend/scripts/check_apk_libcxx_symbols.sh" \
            "$APK" armeabi-v7a
        shell: bash

      - name: Locate and package armeabi-v7a APK (+ SHA256)
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          # The arm build produces app-release.apk; accept the split name too in
          # case the tool starts emitting per-ABI files again.
          APK_PATH="frontend/appflowy_flutter/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="frontend/appflowy_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="$(find frontend/appflowy_flutter/build -name "*.apk" | head -n 1)"
          fi
          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: armeabi-v7a release APK was not found!"
            find frontend/appflowy_flutter/build/app/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-artifacts/appflowy-armeabi-v7a.apk
          (cd release-artifacts && sha256sum appflowy-armeabi-v7a.apk > appflowy-armeabi-v7a.apk.sha256)
          ls -lh release-artifacts/
        shell: bash

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appflowy-armeabi-v7a-apk
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag and title
        id: release_info
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Real in-app versioning: the tag comes from the app version in
            # pubspec.yaml (e.g. 0.11.4 -> v0.11.4), like a VERSION file in
            # other projects. Falls back to v1.0.<run_number> if missing.
            VERSION_NAME="$(sed -n 's/^version:[[:space:]]*//p' frontend/appflowy_flutter/pubspec.yaml | tr -d '[:space:]')"
            if [ -n "$VERSION_NAME" ]; then
              TAG="v$VERSION_NAME"
            else
              TAG="v1.0.${{ github.run_number }}"
            fi
          fi
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            TITLE="${{ github.event.inputs.release_name }}"
          else
            TITLE="AppFlowy armeabi-v7a Release $TAG"
          fi
          SHA256="$(cut -d' ' -f1 release-artifacts/appflowy-armeabi-v7a.apk.sha256)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create GitHub Release and Upload Asset
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          files: |
            release-artifacts/appflowy-armeabi-v7a.apk
            release-artifacts/appflowy-armeabi-v7a.apk.sha256
          body: |
            ### AppFlowy — armeabi-v7a APK Release

            **Architecture:** `armeabi-v7a` (32-bit ARM Android)
            **Release Tag:** `${{ steps.release_info.outputs.tag }}`
            **Commit:** `${{ github.sha }}`
            **Flutter:** ${{ env.FLUTTER_VERSION }} · **Rust:** ${{ env.RUST_TOOLCHAIN }} · **NDK:** r28c (`${{ env.NDK_VERSION }}`)

            - Built for 32-bit ARM devices (e.g. Redmi 9A / Helio G25, Android 11)
            - `libdart_ffi.so` and the packaged `libc++_shared.so` come from the SAME NDK r28c runtime — verified by a post-build `__ndk1` symbol check in CI
            - Stable release signature: updates install over previous releases without losing user data

            #### Verification
            SHA256 checksum:
            ```
            ${{ steps.release_info.outputs.sha256 }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
